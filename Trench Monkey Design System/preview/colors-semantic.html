<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Semantic Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--tm-canvas); font-family: var(--tm-font-ui); }
  .card { padding: 22px 28px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .swatch { display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 64px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; }
  .name { font-weight: 700; color: var(--tm-ink); font-size: 13px; }
  .hex { font-family: var(--tm-font-mono); font-size: 11px; color: var(--tm-text-muted); }
</style>
</head>
<body>
<div class="card">
  <div class="swatch"><div class="chip" style="background: var(--tm-success);">Saved</div><div class="name">Success</div><div class="hex">#1e9e5b</div></div>
  <div class="swatch"><div class="chip" style="background: var(--tm-warning);">Heads up</div><div class="name">Warning</div><div class="hex">#d98a07</div></div>
  <div class="swatch"><div class="chip" style="background: var(--tm-danger);">Error</div><div class="name">Danger</div><div class="hex">#d8453a</div></div>
  <div class="swatch"><div class="chip" style="background: var(--tm-info);">FYI</div><div class="name">Info</div><div class="hex">#17a8f1</div></div>
</div>
</body>
</html>
