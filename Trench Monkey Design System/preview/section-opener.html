<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Section Opener</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--tm-canvas); font-family: var(--tm-font-ui); }
  .wrap { padding: 24px 32px; }
  .rule { width: 32px; height: 2px; background: var(--tm-navy); margin-bottom: 18px; }
  h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; color: var(--tm-ink); margin: 0 0 12px; }
  p { font-size: 14px; line-height: 1.6; color: var(--tm-text); max-width: 60ch; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="rule"></div>
  <h1>World Class AI Market Intelligence</h1>
  <p>Enter your prospect's details and Trench Monkey will research the market, segment the audience, position against competitors, build a seasonal calendar, and split the budget — all in under 40 seconds.</p>
</div>
</body>
</html>
