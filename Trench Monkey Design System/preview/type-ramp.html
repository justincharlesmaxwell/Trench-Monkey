<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Type Ramp</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--tm-canvas); font-family: var(--tm-font-ui); }
  .card { padding: 24px 32px; display: grid; grid-template-columns: 96px 1fr; row-gap: 14px; column-gap: 24px; align-items: baseline; }
  .meta { font-size: 11px; color: var(--tm-text-muted); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; padding-top: 6px; }
  .h1 { font-size: 36px; font-weight: 800; color: var(--tm-ink); letter-spacing: -0.02em; line-height: 1.1; }
  .h2 { font-size: 24px; font-weight: 700; color: var(--tm-ink); letter-spacing: -0.01em; line-height: 1.15; }
  .body { font-size: 16px; color: var(--tm-text); line-height: 1.55; }
  .small { font-size: 13px; color: var(--tm-text-muted); line-height: 1.45; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--tm-eyebrow); }
</style>
</head>
<body>
<div class="card">
  <div class="meta">H1 · 48/56</div><div class="h1" style="font-size: 48px;">World class AI market intelligence</div>
  <div class="meta">H2 · 36</div><div class="h1">Pitch ready to present</div>
  <div class="meta">H3 · 24</div><div class="h2">Receive a curated deck outline</div>
  <div class="meta">Body · 16</div><div class="body">Plus Jakarta Sans, weight 400. Used for paragraphs, descriptions and long-form copy.</div>
  <div class="meta">Small · 13</div><div class="small">Captions, metadata and tertiary text.</div>
  <div class="meta">Eyebrow · 12</div><div class="eyebrow">DATA-BACKED</div>
</div>
</body>
</html>
