<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--tm-canvas); font-family: var(--tm-font-ui); }
  .card { padding: 24px 32px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
  .swatch { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .box { width: 100%; height: 72px; background: var(--tm-blue); }
  .name { font-weight: 700; color: var(--tm-ink); font-size: 13px; }
  .val { font-family: var(--tm-font-mono); font-size: 11px; color: var(--tm-text-muted); }
  .use { font-size: 11px; color: var(--tm-text); line-height: 1.4; }
</style>
</head>
<body>
<div class="card">
  <div class="swatch"><div class="box" style="border-radius: 6px;"></div><div class="name">sm</div><div class="val">6 px</div><div class="use">Inline code</div></div>
  <div class="swatch"><div class="box" style="border-radius: 10px;"></div><div class="name">md</div><div class="val">10 px</div><div class="use">Buttons, inputs</div></div>
  <div class="swatch"><div class="box" style="border-radius: 12px;"></div><div class="name">lg</div><div class="val">12 px</div><div class="use">Media</div></div>
  <div class="swatch"><div class="box" style="border-radius: 16px;"></div><div class="name">xl</div><div class="val">16 px</div><div class="use">Cards</div></div>
  <div class="swatch"><div class="box" style="border-radius: 9999px;"></div><div class="name">pill</div><div class="val">9999</div><div class="use">Chips</div></div>
</div>
</body>
</html>
