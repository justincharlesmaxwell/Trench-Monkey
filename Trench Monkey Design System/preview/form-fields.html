<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Form Fields</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--tm-canvas); font-family: var(--tm-font-ui); }
  .wrap { padding: 22px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .lbl { font-size: 13px; font-weight: 600; color: var(--tm-ink); }
  .help { font-size: 12px; color: var(--tm-text-muted); }
  .input {
    font-family: var(--tm-font-ui);
    font-size: 14px;
    color: var(--tm-ink);
    background: white;
    border: 1px solid var(--tm-hairline);
    border-radius: 10px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 120ms var(--tm-ease-out), box-shadow 120ms var(--tm-ease-out);
  }
  .input:focus { border-color: var(--tm-blue); box-shadow: 0 0 0 3px rgba(23, 168, 241, 0.18); }
  .input::placeholder { color: var(--tm-text-muted); }
  .input--err { border-color: var(--tm-danger); }
  .err { font-size: 12px; color: var(--tm-danger); }
  select.input { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%234a5068' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; padding-right: 36px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="field">
    <label class="lbl">Prospect name</label>
    <input class="input" placeholder="e.g. Acme Inc." value="Lumen Yoga Studios">
  </div>
  <div class="field">
    <label class="lbl">Industry</label>
    <select class="input"><option>Wellness &amp; lifestyle</option></select>
  </div>
  <div class="field">
    <label class="lbl">Budget (USD)</label>
    <input class="input" placeholder="$25,000" value="">
    <span class="help">We split this across channels in your output.</span>
  </div>
  <div class="field">
    <label class="lbl">Email</label>
    <input class="input input--err" value="not-an-email">
    <span class="err">Looks off — double-check the format.</span>
  </div>
</div>
</body>
</html>
