<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brand Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--tm-canvas); font-family: var(--tm-font-ui); }
  .card { padding: 24px 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .swatch { display: flex; flex-direction: column; gap: 10px; }
  .chip { height: 88px; border-radius: 12px; }
  .name { font-weight: 700; color: var(--tm-ink); font-size: 14px; }
  .hex { font-family: var(--tm-font-mono); font-size: 12px; color: var(--tm-text-muted); }
  .use { font-size: 12px; color: var(--tm-text); line-height: 1.45; margin-top: 2px; }
</style>
</head>
<body>
<div class="card">
  <div class="swatch">
    <div class="chip" style="background: var(--tm-blue);"></div>
    <div class="name">Brand Blue</div>
    <div class="hex">#17a8f1</div>
    <div class="use">Wordmark "Trench" · "The Problem" · accent rules.</div>
  </div>
  <div class="swatch">
    <div class="chip" style="background: var(--tm-orange);"></div>
    <div class="name">Brand Orange</div>
    <div class="hex">#ff9614</div>
    <div class="use">Wordmark "Monkey" · "The Solution" · paired with Blue.</div>
  </div>
  <div class="swatch">
    <div class="chip" style="background: var(--tm-navy);"></div>
    <div class="name">Brand Navy</div>
    <div class="hex">#094cb2</div>
    <div class="use">Card icon glyphs · section accent rule. Deep, anchoring.</div>
  </div>
</div>
</body>
</html>
