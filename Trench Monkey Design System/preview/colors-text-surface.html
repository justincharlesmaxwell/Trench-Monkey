<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text + Surface Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--tm-canvas); font-family: var(--tm-font-ui); }
  .card { padding: 22px 28px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .swatch { display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 64px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--tm-hairline); }
  .name { font-weight: 700; color: var(--tm-ink); font-size: 13px; }
  .hex { font-family: var(--tm-font-mono); font-size: 11px; color: var(--tm-text-muted); }
  .use { font-size: 11px; color: var(--tm-text); line-height: 1.4; }
</style>
</head>
<body>
<div class="card">
  <div class="swatch"><div class="chip" style="background: var(--tm-ink);"></div><div class="name">Ink</div><div class="hex">#0f1523</div><div class="use">Headings</div></div>
  <div class="swatch"><div class="chip" style="background: var(--tm-text);"></div><div class="name">Text</div><div class="hex">#4a5068</div><div class="use">Body copy</div></div>
  <div class="swatch"><div class="chip" style="background: var(--tm-text-muted);"></div><div class="name">Muted</div><div class="hex">#6c7388</div><div class="use">Captions, meta</div></div>
  <div class="swatch"><div class="chip" style="background: var(--tm-eyebrow);"></div><div class="name">Eyebrow</div><div class="hex">#414652</div><div class="use">All-caps labels</div></div>
  <div class="swatch"><div class="chip" style="background: var(--tm-canvas);"></div><div class="name">Canvas</div><div class="hex">#f5f6f9</div><div class="use">Page bg</div></div>
  <div class="swatch"><div class="chip" style="background: var(--tm-card);"></div><div class="name">Card</div><div class="hex">#eef0f7</div><div class="use">Feature card</div></div>
  <div class="swatch"><div class="chip" style="background: var(--tm-chrome);"></div><div class="name">Chrome</div><div class="hex">#fdfdfe</div><div class="use">Nav</div></div>
  <div class="swatch"><div class="chip" style="background: var(--tm-hairline);"></div><div class="name">Hairline</div><div class="hex">#e5e8ee</div><div class="use">1px borders</div></div>
</div>
</body>
</html>
